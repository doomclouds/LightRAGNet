services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - C:/WorkSpace/stores/qdrant/storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - C:/WorkSpace/stores/neo4j/data:/data
      - C:/WorkSpace/stores/neo4j/logs:/logs
      - C:/WorkSpace/stores/neo4j/conf:/var/lib/neo4j/conf
      - C:/WorkSpace/stores/neo4j/import:/var/lib/neo4j/import
      - C:/WorkSpace/stores/neo4j/plugins:/var/lib/neo4j/plugins
    restart: unless-stopped
